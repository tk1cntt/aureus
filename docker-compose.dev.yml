version: '3.8'

services:
  redis-dev:
    image: redis:alpine
    container_name: aureus_redis_dev
    ports:
      - "${DEV_REDIS_PORT:-6380}:6379"
    restart: unless-stopped
    networks:
      - aureus_dev_net

  aureus-gateway-dev:
    build:
      context: ./services/aureus-gateway
    container_name: aureus-gateway-dev
    ports:
      - "${DEV_BACKTEST_WS_PORT:-5555}:5555"
      - "${DEV_BACKTEST_EVENTS_PORT:-5556}:5556"
    depends_on:
      - redis-dev
    networks:
      - aureus_dev_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1', 5556)); s.close(); print('ok')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    environment:
      - REDIS_HOST=redis-dev
      - REDIS_PORT=6379
      - TCP_PORT=5556
      - PYTHONUNBUFFERED=1
      - LOG_FILE=/app/logs/aureus-gateway.log
    volumes:
      - ./services/aureus-gateway:/app
      - ./logs:/app/logs

  timescaledb-dev:
    image: timescale/timescaledb:latest-pg15
    container_name: aureus_timescaledb_dev
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_USER=aureus
      - POSTGRES_DB=aureus
    ports:
      - "${DEV_DB_PORT:-5433}:5432"
    restart: unless-stopped
    volumes:
      - timescaledb_data_dev:/var/lib/postgresql/data
    networks:
      - aureus_dev_net

  aureus-db-writer-dev:
    build:
      context: ./services/aureus-db-writer
    container_name: aureus-db-writer-dev
    depends_on:
      - redis-dev
      - timescaledb-dev
    networks:
      - aureus_dev_net
    restart: always
    environment:
      - REDIS_HOST=redis-dev
      - REDIS_PORT=6379
      - POSTGRES_HOST=timescaledb-dev
      - POSTGRES_PORT=5432
      - POSTGRES_DB=aureus
      - POSTGRES_USER=aureus
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - BATCH_SIZE=50
      - BATCH_TIMEOUT_MS=1000
      - PYTHONUNBUFFERED=1
      - LOG_FILE=/app/logs/aureus-db-writer.log
    volumes:
      - ./services/aureus-db-writer:/app
      - ./logs:/app/logs

  aureus-signal-dev:
    build:
      context: ./services/aureus-signal
    container_name: aureus-signal-dev
    depends_on:
      - redis-dev
      - timescaledb-dev
    networks:
      - aureus_dev_net
    restart: always
    environment:
      - REDIS_HOST=redis-dev
      - REDIS_PORT=6379
      - DATABASE_URL=postgresql://aureus:${DB_PASSWORD:-aureus_password}@timescaledb-dev:5432/aureus
      - LOG_LEVEL=INFO
      - SYMBOLS=XAUUSD,BTCUSD,ETHUSD,USTEC,USDJPY,EURUSD,GBPUSD,AUDUSD
      - LLM_BASE_URL=http://host.docker.internal:8005/v1
      - PYTHONUNBUFFERED=1
      - LOG_FILE=/app/logs/aureus-signal.log
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./services/aureus-signal:/app
      - ./services/aureus-signal/brain:/app/brain
      - ./logs:/app/logs

  aureus-strategy-executor-dev:
    build:
      context: ./services/aureus-signal
    container_name: aureus-strategy-executor-dev
    depends_on:
      - redis-dev
      - timescaledb-dev
      - aureus-signal-dev
    networks:
      - aureus_dev_net
    restart: always
    environment:
      - REDIS_HOST=redis-dev
      - REDIS_PORT=6379
      - DATABASE_URL=postgresql://aureus:${DB_PASSWORD:-aureus_password}@timescaledb-dev:5432/aureus
      - LOG_LEVEL=DEBUG
      - SYMBOLS=XAUUSD,BTCUSD,ETHUSD,USTEC,USDJPY,EURUSD,GBPUSD,AUDUSD
      - LLM_BASE_URL=http://host.docker.internal:8005/v1
      - PYTHONUNBUFFERED=1
      - LOG_FILE=/app/logs/aureus-strategy-executor.log
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["python", "main_executor.py"]
    volumes:
      - ./services/aureus-signal:/app
      - ./services/aureus-signal/brain:/app/brain
      - ./logs:/app/logs


  nautilus_trader-dev:
    image: ghcr.io/nautechsystems/nautilus_trader:nightly
    container_name: nautilus-trader-dev
    depends_on:
      - redis-dev
    networks:
      - aureus_dev_net
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=redis-dev
      - REDIS_PORT=6379
    command: [ "python", "-c", "import nautilus_trader, time; print('nautilus_trader ready'); time.sleep(10**9)" ]
    volumes:
      - ./logs:/app/logs

  aureus-nautilus-node-dev:
    build:
      context: ./services/aureus-nautilus-node
    container_name: aureus-nautilus-node-dev
    depends_on:
      - redis-dev
    networks:
      - aureus_dev_net
    restart: unless-stopped
    stop_grace_period: 20s
    environment:
      - REDIS_HOST=redis-dev
      - REDIS_PORT=6379
      - NAUTILUS_SYMBOL_WHITELIST=${NAUTILUS_SYMBOL_WHITELIST:-XAUUSD}
      - NAUTILUS_RISK_MODE=STRICT
      - NAUTILUS_REQUIRE_SL_TP=1
      - NAUTILUS_MAX_ORDER_NOTIONAL=${NAUTILUS_MAX_ORDER_NOTIONAL:-10000}
      - NAUTILUS_MAX_POSITION_NOTIONAL=${NAUTILUS_MAX_POSITION_NOTIONAL:-100000}
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib; pathlib.Path('/tmp/nautilus-health').write_text('ok'); print('ok')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    volumes:
      - ./services/aureus-nautilus-node:/app
      - ./logs:/app/logs

  aureus-nautilus-bridge-dev:
    build:
      context: ./services/aureus-nautilus-bridge
    container_name: aureus-nautilus-bridge-dev
    depends_on:
      - redis-dev
      - nautilus_trader-dev
    networks:
      - aureus_dev_net
    restart: always
    environment:
      - REDIS_HOST=redis-dev
      - REDIS_PORT=6379
      - NAUTILUS_ADAPTER_MODE=${NAUTILUS_ADAPTER_MODE:-simulated}
      - NAUTILUS_LIFECYCLE_STREAM_PATTERN=${NAUTILUS_LIFECYCLE_STREAM_PATTERN:-aureus:stream:*:nautilus_execution}
      - LOG_LEVEL=INFO
      - PYTHONUNBUFFERED=1
      - LOG_FILE=/app/logs/aureus-nautilus-bridge.log
    volumes:
      - ./services/aureus-nautilus-bridge:/app
      - ./logs:/app/logs

  redis-exporter-dev:
    image: oliver006/redis_exporter:latest
    container_name: redis-exporter-dev
    depends_on:
      - redis-dev
    networks:
      - aureus_dev_net
    restart: unless-stopped
    environment:
      - REDIS_ADDR=redis://redis-dev:6379

  aureus-bridge-metrics-dev:
    build:
      context: ./services/aureus-bridge-metrics-exporter
    container_name: aureus-bridge-metrics-dev
    depends_on:
      - redis-dev
      - aureus-nautilus-bridge-dev
    networks:
      - aureus_dev_net
    restart: unless-stopped
    environment:
      - REDIS_HOST=redis-dev
      - REDIS_PORT=6379
      - EXPORTER_PORT=9108
      - POLL_INTERVAL_SECONDS=2
      - SYMBOLS=XAUUSD,BTCUSD,ETHUSD,USTEC,USDJPY,EURUSD,GBPUSD,AUDUSD
      - LOG_LEVEL=INFO
      - PYTHONUNBUFFERED=1
    ports:
      - "${DEV_BRIDGE_METRICS_PORT:-19158}:9108"

  prometheus-dev:
    image: prom/prometheus:latest
    container_name: prometheus-dev
    depends_on:
      - redis-exporter-dev
      - aureus-bridge-metrics-dev
    networks:
      - aureus_dev_net
    restart: unless-stopped
    ports:
      - "${DEV_PROMETHEUS_PORT:-19590}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./monitoring/prometheus/rules/nautilus-alerts.yml:/etc/prometheus/nautilus-alerts.yml:ro

  grafana-dev:
    image: grafana/grafana:latest
    container_name: grafana-dev
    depends_on:
      - prometheus-dev
    networks:
      - aureus_dev_net
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_PLUGINS_PREINSTALL_SYNC=redis-datasource
    ports:
      - "${DEV_GRAFANA_PORT:-13555}:3000"
    volumes:
      - grafana_data_dev:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro

  aureus-dashboard-api-dev:
    build:
      context: ./services/aureus-dashboard/api
    container_name: aureus-dashboard-api-dev
    depends_on:
      - redis-dev
      - timescaledb-dev
    networks:
      - aureus_dev_net
    restart: always
    environment:
      - REDIS_HOST=redis-dev
      - REDIS_PORT=6379
      - DATABASE_URL=postgresql://aureus:${DB_PASSWORD:-aureus_password}@timescaledb-dev:5432/aureus
      - LLM_BASE_URL=http://host.docker.internal:8005/v1
      - CORS_ORIGINS=http://localhost:${DEV_WEB_PORT:-17222},http://127.0.0.1:${DEV_WEB_PORT:-17222}
      - PYTHONUNBUFFERED=1
      - LOG_FILE=/app/logs/aureus-dashboard-api.log
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${DEV_API_PORT:-8002}:8001"
    volumes:
      - ./services/aureus-signal/symbols.json:/app/symbols.json
      - ./logs:/app/logs

  aureus-notifier-dev:
    build:
      context: ./services/aureus-notifier
    container_name: aureus-notifier-dev
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_STRATEGY_BOT_TOKEN=${TELEGRAM_STRATEGY_BOT_TOKEN}
      - TELEGRAM_DEFAULT_CHAT_ID=${TELEGRAM_DEFAULT_CHAT_ID}
      - REDIS_HOST=redis-dev
      - REDIS_PORT=6379
      - SYMBOLS=${SYMBOLS:-XAUUSD,BTCUSD,ETHUSD,USTEC,USDJPY,EURUSD,GBPUSD,AUDUSD}
      - TELEGRAM_ORDER_BOT_TOKEN=${TELEGRAM_ORDER_BOT_TOKEN}
      - LOG_LEVEL=INFO
      - PYTHONUNBUFFERED=1
    networks:
      - aureus_dev_net
    depends_on:
      - redis-dev
    restart: unless-stopped

  aureus-trader-dev:
    build:
      context: ./services/aureus-trader
    container_name: aureus-trader-dev
    environment:
      - REDIS_HOST=redis-dev
      - REDIS_PORT=6379
      - SYMBOLS=${SYMBOLS:-XAUUSD,BTCUSD,ETHUSD,USTEC,USDJPY,EURUSD,GBPUSD,AUDUSD}
      - LOG_LEVEL=INFO
      - PYTHONUNBUFFERED=1
    networks:
      - aureus_dev_net
    depends_on:
      - redis-dev
    restart: unless-stopped

networks:
  aureus_dev_net:
    driver: bridge

volumes:
  timescaledb_data_dev:
  grafana_data_dev:
