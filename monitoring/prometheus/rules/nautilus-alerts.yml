groups:
  - name: nautilus_production_alerts
    rules:
      - alert: NautilusBridgeRestartSpike
        expr: changes(process_start_time_seconds{job="aureus_bridge_metrics"}[10m]) > 0
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Bridge restart detected during rollout window"
          description: "Exporter process start time changed in the last 10 minutes. Keep canary gate in hold and inspect restart cause before promotion."

      - alert: NautilusMissingSLViolation
        expr: increase(aureus_bridge_orders_missing_sl_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Missing SL violation detected"
          description: "Strict risk policy violation: at least one order without stop-loss was observed in the last 5 minutes."

      - alert: NautilusMissingTPViolation
        expr: increase(aureus_bridge_orders_missing_tp_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Missing TP violation detected"
          description: "Strict risk policy violation: at least one order without take-profit was observed in the last 5 minutes."

      - alert: NautilusDuplicateTraceIdDetected
        expr: increase(aureus_bridge_duplicate_trace_id_total[10m]) > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Duplicate trace id detected"
          description: "Duplicate trace-id events were observed in bridge order flow. Treat as idempotency gate failure until root cause is resolved."

      - alert: NautilusPnLStreamStale
        expr: time() - max(timestamp(aureus_bridge_realized_pnl)) > 120
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "PnL stream appears stale"
          description: "Bridge exporter has not produced a fresh realized PnL sample within the SLO threshold (120s) for at least 3 minutes."
