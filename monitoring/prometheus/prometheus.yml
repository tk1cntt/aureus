global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml
  - /etc/prometheus/nautilus-alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090", "prometheus-dev:9090"]

  - job_name: redis_exporter
    static_configs:
      - targets: ["redis-exporter:9121", "redis-exporter-dev:9121"]

  - job_name: aureus_bridge_metrics
    static_configs:
      - targets: ["aureus-bridge-metrics:9108", "aureus-bridge-metrics-dev:9108"]
